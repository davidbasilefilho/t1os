[Unit]
Wants=t1os-android.service

[Service]
Environment=ANDROID_HOME=%h/Android/Sdk
Environment=SERVE_EMU_FFMPEG=/usr/bin/ffmpeg
Environment=PATH=/opt/t1os/current/agent-host/bin:%h/Android/Sdk/platform-tools:%h/Android/Sdk/emulator:%h/Android/Sdk/cmdline-tools/latest/bin:/usr/local/bin:/usr/bin:/bin
