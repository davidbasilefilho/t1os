name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned tools from mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.10

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate hooks
        run: hk validate

      - name: Verify
        run: bun run verify

      - name: Check VM guard and first-boot syntax
        run: |
          python3 -B -m unittest discover -s platform -p 'test_*.py' -v
          bash -n platform/first-boot

      - name: Check private runtime configuration
        run: |
          bash runtime/tests/runtime-config.sh
          python3 -B -m unittest discover -s runtime/tests -p 'test_*.py' -v
          python3 -B runtime/tests/browser-config.py
